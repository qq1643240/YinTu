name: Redacto
options:
  bundleIdPrefix: com.redacto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Redacto:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: PhotoEditorExtension
      - target: ActionShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redacto.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Redacto
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: 保存打码后的图片到相册时需要此权限。
        NSPhotoLibraryUsageDescription: 仅在您选择「分享并删除原图」时用于删除所选照片，不会上传任何内容。
        ITSAppUsesNonExemptEncryption: false

  PhotoEditorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/PhotoEditor
      # 复用主 App 的完整编辑器（除 App 入口与导出 UI 外全部共享源码）
      - path: Sources
        excludes:
          - "App/**"
          - "Export/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redacto.app.PhotoEditor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Extensions/PhotoEditor/Support/Info.plist
      properties:
        CFBundleDisplayName: Redacto 打码
        NSExtension:
          NSExtensionPointIdentifier: com.apple.photo-editing
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PhotoEditorViewController"

  ActionShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ActionShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redacto.app.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Extensions/ActionShare/Support/Info.plist
      properties:
        CFBundleDisplayName: 存入相册待打码
        NSPhotoLibraryAddUsageDescription: 把分享来的图片存入相册，方便到 Redacto 中打码。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
